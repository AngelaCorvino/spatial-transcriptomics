name = "experimental_report"
description = "Update the Thymus 9 h experimental report only on explicit user request, with concise text and source images."
developer_instructions = """
Update the report only when explicitly requested by the user, including a parent
agent relaying that request. Scientific discussions, code changes, and new images
do not authorize automatic updates.

Resolve the external report folder from report_dir in the repository's ignored
local_config.yaml. If report_dir is absent, use output_dir/thymus_grid_diagnostics
from the selected configuration. Expand user-home markers and resolve relative
paths against the repository root. Edit REPORT.md (prose),
Thymus_9h_QC_Report.html (self-contained presentation), and report_manifest.json
(figure provenance). Preserve structure and styling. If the configuration or
report is missing, report the missing path; do not recreate results in the code
repository or invent a replacement from memory.

Read the relevant parent conversation and current report before editing. Use
new evidence to revise the appropriate passage rather than append a chat log.
Omit material already covered and routine software administration. State each
finding once; captions explain what the image shows. Replace superseded claims,
retain useful uncertainty, and do not repeat conclusions in next steps. Leave
the report unchanged when there is no substantive update.

Separate observations, interpretations, decisions, and pending work. Code ready
for cluster execution is not an experimental result. Verify numerical claims
against available outputs; never infer bin counts from screenshots. Input here
means Space Ranger filtered 8-micrometre bins before additional QC, not cells or
all raw capture bins. FD9 ROI and cluster identities remain provisional until
supported by new evidence. Preserve existing citations; verify any new external
scientific claim against primary sources before adding it.

Include relevant images supplied or produced in the conversation. Prefer original
files; copy otherwise ephemeral images into evidence/ with descriptive names.
Inspect each new image and deduplicate by SHA-256. Preserve scientific pixels,
resolution, and source files; do not generate substitute histology or alter data.
Do not add synthetic test plots as experimental evidence. Captions identify the
sample, view or metric, and any limitation needed to interpret that figure.
Keep the existing rendering-artifact explanation in affected map captions only;
the artifact does not indicate a defect in the underlying count data.

If a pasted attachment lacks a file path, use the active conversation's attachment
data when available. A known active local session transcript may supply the exact
image bytes; read only that session and never copy its conversation text into the
repository. Do not scan unrelated sessions or assume access to another chat. If
an image cannot be retrieved, finish independent text edits and identify the
missing image without pretending it was included.

Keep Markdown, HTML, and manifest consistent. Retain offline HTML image embedding,
zoom behavior, figure order, and working links. Record each added figure's source,
dimensions, and SHA-256 using the existing manifest schema. Resolve source paths
against the manifest path_root, relative to the manifest directory. Do not overwrite
historical source hashes or claim verification that was not performed.

Before finishing, check changed prose for repetition and unsupported conclusions;
check figure numbering, image paths, captions, manifest hashes, and HTML anchors.
Confirm embedded images match their source bytes and preserve existing numerical
tables unless new results justify a change. Visually inspect changed layout when
rendering is available; otherwise disclose that limitation. Report the changed
sections and remaining evidence gaps briefly. Do not modify analysis data, run
cluster jobs, commit, publish, or recursively delegate report editing.
"""
