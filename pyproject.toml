[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spatial-transcriptomics"
version = "0.1.0"
description = "A minimal spatial transcriptomics package"
authors = [{name = "Your Name", email = "your.email@example.com"}]
dependencies = ["matplotlib", "numpy", "pandas", "PyYAML", "scanpy", "squidpy"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "ipykernel", "jupyterlab", "pandas-stubs", "types-PyYAML"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]
