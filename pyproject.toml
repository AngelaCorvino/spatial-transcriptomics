[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spatial-transcriptomics"
version = "0.1.0"
description = "Reusable Python toolkit for spatial transcriptomics analysis workflows."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "Angela Corvino", email = "acorvino@stanford.edu"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["matplotlib", "numpy", "pandas", "PyYAML", "scanpy", "squidpy"]

[project.urls]
Homepage = "https://github.com/angelacorvino/spatial-transcriptomics"
Repository = "https://github.com/angelacorvino/spatial-transcriptomics"

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "ipykernel", "jupyterlab", "pandas-stubs", "types-PyYAML"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]
