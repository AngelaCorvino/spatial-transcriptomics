[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spatial-transcriptomics"
version = "0.1.0"
description = "A minimal spatial transcriptomics package"
authors = [{name = "Your Name", email = "your.email@example.com"}]
dependencies = ["matplotlib", "numpy", "pandas", "PyYAML"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "ipykernel", "jupyterlab", "pandas-stubs", "types-PyYAML"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "I", "N", "UP", "YTT", "S", "BLE", "FBT", "B", "A", "COM", "C4", "DTZ", "T10", "DJ", "EM", "EXE", "FA", "ISC", "ICN", "G", "INP", "PIE", "T20", "PYI", "PT", "Q", "RSE", "RET", "SLF", "SLOT", "SIM", "TID", "TCH", "INT", "ARG", "PTH", "ERA", "PD", "PGH", "PL", "TRY", "FLY", "NPY", "AIR", "PERF", "FURB", "LOG", "RUF", "D"]
ignore = ["EM101", "EM102", "FBT001", "FBT002", "FBT003", "PLC0415", "PLR0913", "RUF022", "T201", "TC003", "TRY003"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"setup.py" = ["D100"]
"tests/*" = ["S101", "PLR2004"]

[tool.mypy]
strict = true
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*", "scanpy", "scanpy.*", "squidpy", "squidpy.*", "yaml", "yaml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]
