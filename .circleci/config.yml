version: 2.1

workflows:
  test:
    jobs:
      - test

jobs:
  test:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install dev dependencies
          command: make dev-install
      - run:
          name: Run ruff
          command: make lint
      - run:
          name: Run mypy
          command: make typecheck
      - run:
          name: Run pytest
          command: make test
