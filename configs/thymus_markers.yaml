interpretation:
  general: >-
    Assign broad labels from several concordant genes, cluster-enriched genes and
    H&E. These groups overlap biologically; they are not mutually exclusive cell
    classes or a trained classifier. Check marker_coverage.csv before using absence
    as evidence. Proliferation is a state. Mixed bins may remain unassigned.
  lymphoid: >-
    Rag genes also occur in B-cell precursors. Cd3g supports T lineage, not gamma-delta
    identity alone. CD4/CD8 co-expression can reflect immature thymocytes or mixed
    bins. Nkg7/Klrd1 are shared with cytotoxic T cells; interpret Ncr1 with T markers.
    Ctla4/Ikzf2 require Foxp3 and T-lineage context for a regulatory-T label.
  myeloid: >-
    Lyz2/Lst1/Fcer1g are broad myeloid signals. Xcr1/Clec9a emphasize cDC1 and Flt3
    does not identify a DC subtype alone. Bst2 may reflect interferon activation;
    use it with Siglech/Tcf4. S100a8/S100a9 also occur in inflammatory monocytes.
  epithelium: >-
    Keratins are not thymus-specific. Establish epithelial and Foxn1 context before
    cortex/medulla labels. Ccl21a also marks lymphatic endothelium; Krt5 is shared
    with other epithelia. The medullary list spans several mTEC states.
  stroma: >-
    Contractile genes overlap between smooth muscle, pericytes and myofibroblasts.
    The lung Pericyte1 genes are reviewed here as a contractile program, not copied
    as a definitive pericyte label. Fabp4/Lpl need Adipoq and anatomical support.
  anatomical_exclusion: >-
    Muscle or Pth expression alone does not define an exclusion mask. Require
    coherent spatial expression and H&E; Pth can also originate from mTECs.

selection_notes:
  - Broad source categories were selected; lung-specific epithelial and vascular subtype labels were not transferred.
  - Cga and Plvap2 were not imported; their intended use in the JPA table needs clarification.
  - Stfpc, Stfpa1 and Tgbfi were not imported; probable spelling errors remain unchanged in the source files.
  - Hbb-b1 was not silently mapped to Hbb-bs; Hbb-bs has its own published mouse-thymocyte source.
  - Dntt, Csf1r, Adgre1, Myh2, Alas2 and Chga were omitted from the initial list to keep this selection compact and explicitly sourced; this is not evidence against their biological relevance.
