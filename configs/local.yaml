# Local runtime settings for reproducible analysis
# Example storage is a sibling of the code repository.
# Copy to local_config.yaml and adapt paths for your machine.

repo_root: .
data_dir: ../spatial-transcriptomics-data/thymus_9h/raw_data
output_dir: ../spatial-transcriptomics-data/thymus_9h/processed_data
cache_dir: ../spatial-transcriptomics-data/thymus_9h/.cache
report_dir: ../spatial-transcriptomics-data/thymus_9h/processed_data/thymus_grid_diagnostics

samplesheet: configs/samplesheet.csv

# Local equivalent of the extracted Space Ranger HD staging layout.
visium_hd:
  sample_id: FD_1
  staged_dir: ../spatial-transcriptomics-data/thymus_9h/.cache/FD1_HD
  source_dir: ../spatial-transcriptomics-data/thymus_9h/raw_data/FD1
  bin_size_um: 8
  load_images: true
  use_filtered_matrix: true

analysis:
  min_counts: 500
  max_counts: 20000
  min_genes: 250
  max_genes: 6000
  max_pct_mt: 20.0
  max_pct_rp: 30.0
  target_sum: 10000.0
  resolution: 1.0
  n_pcs: 30
  n_neighbors: 15

paths:
  qc_output: ../spatial-transcriptomics-data/thymus_9h/processed_data/qc
  preprocess_output: ../spatial-transcriptomics-data/thymus_9h/processed_data/preprocess
  integration_output: ../spatial-transcriptomics-data/thymus_9h/processed_data/integration
  spatial_output: ../spatial-transcriptomics-data/thymus_9h/processed_data/spatial
  cell_mapping_output: ../spatial-transcriptomics-data/thymus_9h/processed_data/cell_mapping
