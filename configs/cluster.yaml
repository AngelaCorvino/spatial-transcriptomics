# Cluster runtime settings for SCG SLURM execution.
# Keep code in /home/acorvino/spatial-transcriptomics.
# Raw inputs use the group's /oak allocation; outputs use SCG /labs storage.
# Both storage allocations are hosted on Oak.
# Use /tmp/$USER/$SLURM_JOB_ID only for per-job scratch.

repo_root: .
data_dir: /oak/stanford/groups/dirbas/Angela/thymus_9h/raw_data
output_dir: /labs/dirbas/acorvino/thymus_9h/processed_data
cache_dir: /tmp

samplesheet: configs/samplesheet.csv

conda_env: /home/acorvino/.envs/python-env

# FD1 Visium HD input for notebook and batch QC on SCG compute nodes.
# Store FD1–FD12 under raw_data; stage only square_008um under the job's TMPDIR.
visium_hd:
  sample_id: FD_1
  source_dir: /oak/stanford/groups/dirbas/Angela/thymus_9h/raw_data/FD1
  staged_dir: ${TMPDIR}/FD1_HD
  bin_size_um: 8
  load_images: true
  use_filtered_matrix: true

analysis:
  min_counts: 500
  max_counts: 20000
  min_genes: 250
  max_genes: 6000
  max_pct_mt: 20.0
  max_pct_rp: 30.0
  target_sum: 10000.0
  resolution: 1.0
  n_pcs: 30
  n_neighbors: 15

paths:
  data_dir: /oak/stanford/groups/dirbas/Angela/thymus_9h/raw_data
  output_dir: /labs/dirbas/acorvino/thymus_9h/processed_data
  cache_dir: /tmp
  qc_output: /labs/dirbas/acorvino/thymus_9h/processed_data/qc
  preprocess_output: /labs/dirbas/acorvino/thymus_9h/processed_data/preprocess
  integration_output: /labs/dirbas/acorvino/thymus_9h/processed_data/integration
  spatial_output: /labs/dirbas/acorvino/thymus_9h/processed_data/spatial
  cell_mapping_output: /labs/dirbas/acorvino/thymus_9h/processed_data/cell_mapping
